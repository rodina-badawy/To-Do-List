<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://fav.farm/👤" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #f5f5f8;
            --bg-card: #ffffff;
            --text-main: #222;
            --text-soft: #373232;
            --primary: #3f51b5;
            --primary-soft: #e8eaf6;
            --border-soft: #e0e0e0;
            --input-bg: #f8f9fa;
        }

        body.dark {
            --bg-main: #141b2b;
            --bg-card: #0e172a;
            --text-main: #F8FAFC;
            --text-soft: #CBD5E1;
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --primary-soft: #312E81;
            --border-soft: #334155;
            --input-bg: #111827;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s ease, color 0.3s ease; }

        body {
            background-color: var(--bg-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        html[dir="rtl"] body { direction: rtl; }

        .login-card {
            display: flex;
            width: 1000px;
            min-height: 600px;
            max-width: 100%;
            background-color: var(--bg-card);
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            position: relative;
        }

        .controls-top {
            position: absolute;
            top: 25px;
            left: 25px;
            right: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        html[dir="rtl"] .controls-top {
            flex-direction: row-reverse;
        }

        .lang-toggle {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            padding: 4px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        body:not(.dark) .lang-toggle {
            background: var(--primary-soft);
            border: none;
        }

        .lang-toggle button {
            border: none;
            background: transparent;
            padding: 5px 15px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.75rem;
            color: white;
            font-weight: 700;
        }

        body:not(.dark) .lang-toggle button { color: var(--text-soft); }
        .lang-toggle button.active { background: var(--primary); color: white; }

        .dark-toggle {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        body:not(.dark) .dark-toggle {
            background: var(--primary-soft);
            color: var(--primary);
            border: none;
        }

        .side-info {
            flex: 1;
            background-color: var(--primary);
            padding: 60px 40px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .side-info i { font-size: 4rem; margin-bottom: 20px; opacity: 0.9; }
        .side-info h1 { font-size: 2rem; line-height: 1.2; margin-bottom: 15px; }
        .side-info p { opacity: 0.8; font-size: 1rem; }

        .side-form {
            flex: 1.2;
            padding: 100px 50px 60px;
            background-color: var(--bg-card);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .side-form h2 { color: var(--text-main); font-size: 2rem; margin-bottom: 10px; }
        .side-form p.subtitle { color: var(--text-soft); margin-bottom: 35px; }

        .input-group { margin-bottom: 20px; }
        .label-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .input-group label { color: var(--text-main); font-weight: 600; font-size: 0.9rem; }
        
        .forgot-link { color: var(--primary); text-decoration: none; font-size: 0.8rem; font-weight: 600; }
        .forgot-link:hover { text-decoration: underline; }

        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 15px; color: var(--text-soft); }
        html[dir="rtl"] .input-wrapper i { left: auto; right: 15px; }

        .input-wrapper input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            color: var(--text-main);
            outline: none;
        }
        html[dir="rtl"] .input-wrapper input { padding: 14px 45px 14px 15px; }

        .btn-login {
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .create-account-text { text-align: center; margin-top: 25px; color: var(--text-soft); font-size: 0.9rem; }
        .create-account-text a { color: var(--primary); text-decoration: none; font-weight: 700; }

        @media (max-width: 768px) {
            .login-card { flex-direction: column; min-height: auto; }
            .side-info { order: 1; padding: 80px 20px 40px; }
            .side-form { order: 2; padding: 40px 25px; }
            .controls-top { top: 15px; left: 15px; right: 15px; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="controls-top">
            <div class="lang-toggle">
                <button id="enBtn" onclick="changeLang('en')">EN</button>
                <button id="arBtn" onclick="changeLang('ar')">AR</button>
            </div>
            <button class="dark-toggle" id="modeBtn">
                <i class="fas fa-moon"></i>
            </button>
        </div>

        <div class="side-info">
            <i class="fas fa-rocket"></i>
            <h1 id="sideTitle">Master your day, one task at a time.</h1>
            <p id="sideDesc">Joined by over 10,000+ productive users.</p>
        </div>

        <div class="side-form">
            <h2 id="formTitle">Sign In</h2>
            <p class="subtitle" id="formSubtitle">Welcome! Please enter your details.</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email" id="labelEmail">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label for="password" id="labelPass">Password</label>
                        <a href="forgot-password.html" class="forgot-link" id="forgotLink">Forgot password?</a>
                    </div>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">Sign In</button>
            </form>

            <p class="create-account-text" id="footerText">
                Don't have an account? <a href="signup.html" id="signupLink">Create an account</a>
            </p>
        </div>
    </div>

    <script>
    const translations = {
        en: {
            sideTitle: "Master your day, one task at a time.",
            sideDesc: "Joined by over 10,000+ productive users.",
            formTitle: "Sign In",
            formSubtitle: "Welcome! Please enter your details.",
            labelEmail: "Email Address",
            labelPass: "Password",
            forgotLink: "Forgot password?",
            btnLogin: "Sign In",
            footerText: "Don't have an account? ",
            signupLink: "Create an account",
            placeholderEmail: "name@example.com"
        },
        ar: {
            sideTitle: "سيطر على يومك، مهمة تلو الأخرى.",
            sideDesc: "انضم إلينا أكثر من 10,000 مستخدم منتج.",
            formTitle: "تسجيل الدخول",
            formSubtitle: "أهلاً بك! يرجى إدخال بياناتك.",
            labelEmail: "البريد الإلكتروني",
            labelPass: "كلمة المرور",
            forgotLink: "نسيت كلمة المرور؟",
            btnLogin: "دخول",
            footerText: "ليس لديك حساب؟ ",
            signupLink: "أنشئ حساباً جديداً",
            placeholderEmail: "example@domain.com"
        }
    };

    function changeLang(lang) {
        const html = document.documentElement;
        html.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        html.setAttribute('lang', lang);

        document.getElementById('sideTitle').textContent = translations[lang].sideTitle;
        document.getElementById('sideDesc').textContent = translations[lang].sideDesc;
        document.getElementById('formTitle').textContent = translations[lang].formTitle;
        document.getElementById('formSubtitle').textContent = translations[lang].formSubtitle;
        document.getElementById('labelEmail').textContent = translations[lang].labelEmail;
        document.getElementById('labelPass').textContent = translations[lang].labelPass;
        document.getElementById('forgotLink').textContent = translations[lang].forgotLink;
        document.getElementById('btnLogin').textContent = translations[lang].btnLogin;
        document.getElementById('email').placeholder = translations[lang].placeholderEmail;
        
        // تعديل الـ Footer لضمان عدم حذف رابط الـ Sign up
        const footer = document.getElementById('footerText');
        footer.innerHTML = translations[lang].footerText + `<a href="signup.html" id="signupLink">${translations[lang].signupLink}</a>`;

        document.getElementById('enBtn').classList.toggle('active', lang === 'en');
        document.getElementById('arBtn').classList.toggle('active', lang === 'ar');

        localStorage.setItem('lang', lang); 
    }

    const modeBtn = document.getElementById('modeBtn');
    
    
    window.addEventListener('DOMContentLoaded', () => {
        // الثيم
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark');
            modeBtn.querySelector('i').classList.replace('fa-moon', 'fa-sun');
        }
    
        // اللغة
        const savedLang = localStorage.getItem('lang') || 'en';
        changeLang(savedLang);
    });

    modeBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark');
        const icon = modeBtn.querySelector('i');
        const isDark = document.body.classList.contains('dark');
        icon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
       
        const currentLang = document.documentElement.getAttribute('lang') || 'en';
        localStorage.setItem('lang', currentLang);
        window.location.href = 'index.html'; 
    });
</script>
</body>
</html>
