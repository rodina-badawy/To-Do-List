<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>لوحة المهام</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg-main: #f5f5f8;
      --bg-card: #ffffff;
      --bg-accent: #e3f2fd;
      --text-main: #222;
      --text-soft: #555;
      --primary: #3f51b5;
      --primary-soft: #e8eaf6;
      --danger: #e53935;
      --success: #43a047;
      --warning: #ffb300;
      --shadow-soft: 0 10px 25px rgba(0, 0, 0, 0.05);
      --border-soft: #e0e0e0;
      --bg-completed: #e8f5e9;
      --bg-missed: #fff3e0;
    }

    body.dark {
      --bg-main: #0f172a;
      --bg-card: #111827;
      --bg-accent: #1f2937;
      --text-main: #f9fafb;
      --text-soft: #9ca3af;
      --primary: #6366f1;
      --primary-soft: #1e293b;
      --danger: #f97373;
      --success: #22c55e;
      --warning: #facc15;
      --shadow-soft: 0 10px 25px rgba(0, 0, 0, 0.6);
      --border-soft: #1f2937;
      --bg-completed: #022c22;
      --bg-missed: #3b2600;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #e3f2fd 0, transparent 50%),
                  radial-gradient(circle at bottom right, #fce4ec 0, transparent 50%),
                  var(--bg-main);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: background 0.4s ease, color 0.4s ease;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(18px);
      border-radius: 24px;
      box-shadow: var(--shadow-soft);
      padding: 24px 26px 28px;
      position: relative;
      overflow: hidden;
    }

    body.dark .app {
      background: rgba(15, 23, 42, 0.9);
    }

    /* أنيميشن دخول الصفحة */
    .app {
      animation: fadeInUp 0.6s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* الهيدر */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .greeting {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .greeting h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .greeting p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--text-soft);
    }

    .mood-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.78rem;
      margin-top: 4px;
    }

    .mood-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(67, 160, 71, 0.2);
    }

    /* سويتش الدارك مود */
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-soft);
    }

    .toggle {
      width: 48px;
      height: 24px;
      background: var(--border-soft);
      border-radius: 999px;
      padding: 2px;
      display: flex;
      align-items: center;
      cursor: pointer;
      position: relative;
      transition: background 0.25s ease;
    }

    .toggle-thumb {
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      transform: translateX(0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      transition: transform 0.25s ease, background 0.25s ease;
    }

    body.dark .toggle {
      background: var(--primary);
    }

    body.dark .toggle-thumb {
      transform: translateX(-22px);
      background: #020617;
    }

    /* شريط الأدوات */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }

    .btn {
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 8px 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease,
        color 0.2s ease;
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.97);
      box-shadow: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #7c4dff);
      color: #fff;
      box-shadow: 0 10px 18px rgba(63, 81, 181, 0.3);
    }

    .btn-chip {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-soft);
    }

    .search {
      margin-right: auto;
      min-width: 170px;
      flex: 1 1 180px;
      position: relative;
    }

    .search input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background: rgba(255, 255, 255, 0.7);
      outline: none;
      font-size: 0.88rem;
      color: var(--text-main);
      transition: border 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    body.dark .search input {
      background: rgba(15, 23, 42, 0.9);
    }

    .search input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      color: var(--text-soft);
    }

    /* المحتوى الرئيسي: مهام + منجزة */
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 2.1fr) minmax(0, 1.2fr);
      gap: 18px;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .card {
      background: var(--bg-card);
      border-radius: 18px;
      padding: 14px 14px 12px;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255, 255, 255, 0.5);
      position: relative;
      overflow: hidden;
    }

    body.dark .card {
      border-color: rgba(15, 23, 42, 0.9);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .card-header h2 {
      margin: 0;
      font-size: 0.95rem;
    }

    .card-header small {
      color: var(--text-soft);
      font-size: 0.8rem;
    }

    .tasks-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }

    .task {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      background: var(--bg-accent);
      border-radius: 14px;
      padding: 8px 10px;
      position: relative;
      overflow: hidden;
      border: 1px solid transparent;
      transform-origin: top;
      animation: taskEnter 0.35s ease-out;
    }

    @keyframes taskEnter {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .task.overdue {
      border-color: var(--danger);
      box-shadow: 0 0 0 1px rgba(229, 57, 53, 0.4);
    }

    .task-main {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .task-title {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-soft);
      align-items: center;
    }

    .badge {
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.7rem;
    }

    .badge-work {
      background: #e8eaf6;
      color: #3949ab;
    }

    .badge-personal {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .badge-home {
      background: #fffde7;
      color: #f9a825;
    }

    .badge-priority-high {
      background: #ffebee;
      color: var(--danger);
    }

    .badge-priority-medium {
      background: #fff8e1;
      color: var(--warning);
    }

    .badge-priority-low {
      background: #e3f2fd;
      color: #1976d2;
    }

    .task-time {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .task-time span {
      font-size: 0.75rem;
    }

    .task-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .btn-mini {
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-complete {
      background: var(--success);
      color: #fff;
    }

    .btn-edit {
      background: transparent;
      color: var(--primary);
      border: 1px solid rgba(99, 102, 241, 0.4);
    }

    .btn-delete {
      background: transparent;
      color: var(--danger);
      border: 1px solid rgba(229, 57, 53, 0.4);
    }

    /* المهام المنجزة */
    .completed-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }

    .completed-task {
      background: var(--bg-completed);
      border-radius: 14px;
      padding: 8px 10px;
      font-size: 0.85rem;
      border: 1px solid rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      gap: 4px;
      animation: slideInNote 0.45s ease-out;
    }

    .completed-task.missed {
      background: var(--bg-missed);
      border-color: rgba(229, 57, 53, 0.4);
    }

    @keyframes slideInNote {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .completed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .completed-title {
      font-weight: 600;
    }

    .completed-note {
      font-size: 0.8rem;
      color: var(--text-soft);
    }

    .completed-icon {
      font-size: 1rem;
    }

    /* نوتيفيكيشن سريع */
    .toast {
      position: absolute;
      left: 50%;
      top: 12px;
      transform: translateX(-50%) translateY(-40px);
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--success);
      color: #fff;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 8px 16px rgba(34, 197, 94, 0.35);
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 30;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-icon {
      font-size: 1.1rem;
    }

    /* مودال البوب أب */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--bg-card);
      border-radius: 18px;
      padding: 16px 18px 14px;
      width: 100%;
      max-width: 380px;
      box-shadow: var(--shadow-soft);
      transform: translateY(16px);
      transition: transform 0.25s ease;
    }

    .modal-backdrop.show .modal {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 1rem;
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-body label {
      font-size: 0.8rem;
      color: var(--text-soft);
    }

    .modal-body input,
    .modal-body textarea,
    .modal-body select {
      width: 100%;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid var(--border-soft);
      outline: none;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.85);
      color: var(--text-main);
      resize: vertical;
      min-height: 34px;
    }

    body.dark .modal-body input,
    body.dark .modal-body textarea,
    body.dark .modal-body select {
      background: rgba(15, 23, 42, 0.9);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-sm {
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
    }

    .btn-outline {
      background: transparent;
      color: var(--text-soft);
      border: 1px solid var(--border-soft);
    }

    .btn-fill {
      background: var(--primary);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- توست الإشعار -->
    <div class="toast" id="toast">
      <span class="toast-icon">✅</span>
      <span id="toast-message">تم إنجاز المهمة، شغل جميل!</span>
    </div>

    <!-- هيدر -->
    <header class="app-header">
      <div class="greeting">
        <h1>مرحبًا رُدَيْنة 👋</h1>
        <p>هيا ننظم يومك ونضيف إنجازات جديدة اليوم.</p>
        <div class="mood-badge">
          <span class="mood-dot"></span>
          <span>أنت قادرة على إنهاءها خطوة بخطوة</span>
        </div>
      </div>

      <div class="theme-toggle" id="themeToggle">
        <span>الوضع الليلي</span>
        <div class="toggle">
          <div class="toggle-thumb">🌙</div>
        </div>
      </div>
    </header>

    <!-- شريط أدوات -->
    <div class="toolbar">
      <button class="btn btn-primary" id="addTaskBtn">+ إضافة مهمة</button>

      <button class="btn btn-chip" data-filter="all">الكل</button>
      <button class="btn btn-chip" data-filter="today">مهام اليوم</button>
      <button class="btn btn-chip" data-filter="high">أولوية عالية</button>

      <div class="search">
        <input type="text" id="searchInput" placeholder="ابحثي عن مهمة..." />
        <span class="search-icon">🔍</span>
      </div>
    </div>

    <!-- تخطيط رئيسي -->
    <div class="layout">
      <!-- المهام الحالية -->
      <section class="card">
        <div class="card-header">
          <h2>مهام اليوم</h2>
          <small id="tasksCount">0 مهام</small>
        </div>
        <div class="tasks-list" id="tasksList">
          <!-- يتم حقنه بالـ JS -->
        </div>
      </section>

      <!-- المنجزة -->
      <section class="card">
        <div class="card-header">
          <h2>المهام المنجزة / الفائتة</h2>
          <small>كل خطوة تُحتسب</small>
        </div>
        <div class="completed-list" id="completedList">
          <!-- يتم حقنه بالـ JS -->
        </div>
      </section>
    </div>
  </div>

  <!-- مودال تعديل / إضافة / ملاحظات -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modalTitle">تعديل مهمة</h3>
        <button class="btn-sm btn-outline" id="closeModalBtn">✕</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- حقن محتوى بالـ JS حسب نوع العملية -->
      </div>
      <div class="modal-footer" id="modalFooter">
        <!-- أزرار حفظ/إلغاء بالـ JS -->
      </div>
    </div>
  </div>

  <script>
    // بيانات أولية تجريبية
    let tasks = [
      {
        id: 1,
        title: "إنهاء تقرير المشروع",
        category: "work",
        priority: "high",
        due: new Date(new Date().getTime() + 60 * 60 * 1000), // بعد ساعة
        completed: false
      },
      {
        id: 2,
        title: "شراء بعض الأغراض للبيت",
        category: "home",
        priority: "medium",
        due: new Date(new Date().getTime() + 5 * 60 * 60 * 1000),
        completed: false
      },
      {
        id: 3,
        title: "قراءة 10 صفحات من كتاب",
        category: "personal",
        priority: "low",
        due: new Date(new Date().getTime() - 2 * 60 * 60 * 1000), // متأخرة
        completed: false
      }
    ];

    let completedTasks = [];

    const tasksListEl = document.getElementById("tasksList");
    const completedListEl = document.getElementById("completedList");
    const tasksCountEl = document.getElementById("tasksCount");
    const themeToggleEl = document.getElementById("themeToggle");
    const addTaskBtn = document.getElementById("addTaskBtn");
    const searchInput = document.getElementById("searchInput");
    const toastEl = document.getElementById("toast");
    const toastMessageEl = document.getElementById("toast-message");
    const modalBackdropEl = document.getElementById("modalBackdrop");
    const modalTitleEl = document.getElementById("modalTitle");
    const modalBodyEl = document.getElementById("modalBody");
    const modalFooterEl = document.getElementById("modalFooter");
    const closeModalBtn = document.getElementById("closeModalBtn");

    let currentFilter = "all";
    let currentModalTaskId = null;
    let currentModalMode = null; // "edit" | "add" | "complete" | "missed"

    function formatTime(date) {
      return date.toLocaleTimeString("ar-EG", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function formatDate(date) {
      return date.toLocaleDateString("ar-EG", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    function isOverdue(task) {
      return !task.completed && task.due.getTime() < Date.now();
    }

    function renderTasks() {
      tasksListEl.innerHTML = "";

      const searchTerm = searchInput.value.trim().toLowerCase();

      let filtered = tasks.filter((t) => !t.completed);

      if (currentFilter === "today") {
        const today = new Date();
        filtered = filtered.filter((t) => {
          const sameDay =
            t.due.getDate() === today.getDate() &&
            t.due.getMonth() === today.getMonth() &&
            t.due.getFullYear() === today.getFullYear();
          return sameDay;
        });
      } else if (currentFilter === "high") {
        filtered = filtered.filter((t) => t.priority === "high");
      }

      if (searchTerm) {
        filtered = filtered.filter((t) =>
          t.title.toLowerCase().includes(searchTerm)
        );
      }

      tasksCountEl.textContent = filtered.length + " مهام";

      filtered.forEach((task) => {
        const taskEl = document.createElement("div");
        taskEl.className = "task";
        if (isOverdue(task)) {
          taskEl.classList.add("overdue");
        }

        taskEl.innerHTML = `
          <div class="task-main">
            <div class="task-title">${task.title}</div>
            <div class="task-meta">
              <span class="badge ${getCategoryBadge(task.category)}">
                ${getCategoryLabel(task.category)}
              </span>
              <span class="badge ${getPriorityBadge(task.priority)}">
                أولوية: ${getPriorityLabel(task.priority)}
              </span>
              <span class="task-time">
                ⏰
                <span>${formatTime(task.due)} - ${formatDate(task.due)}</span>
              </span>
              ${
                isOverdue(task)
                  ? `<span style="color: var(--danger); font-size: 0.8rem;">متأخرة 😢</span>`
                  : ""
              }
            </div>
          </div>
          <div class="task-actions">
            <button class="btn-mini btn-complete">${
              isOverdue(task) ? "فاتتني" : "إتمام"
            }</button>
            <button class="btn-mini btn-edit">تعديل</button>
            <button class="btn-mini btn-delete">حذف</button>
          </div>
        `;

        // أزرار
        const completeBtn = taskEl.querySelector(".btn-complete");
        const editBtn = taskEl.querySelector(".btn-edit");
        const deleteBtn = taskEl.querySelector(".btn-delete");

        completeBtn.addEventListener("click", () => {
          if (isOverdue(task)) {
            openCompleteModal(task.id, "missed");
          } else {
            openCompleteModal(task.id, "complete");
          }
        });

        editBtn.addEventListener("click", () => {
          openEditModal(task.id);
        });

        deleteBtn.addEventListener("click", () => {
          deleteTask(task.id);
        });

        tasksListEl.appendChild(taskEl);
      });
    }

    function getCategoryBadge(category) {
      switch (category) {
        case "work":
          return "badge-work";
        case "home":
          return "badge-home";
        case "personal":
        default:
          return "badge-personal";
      }
    }

    function getCategoryLabel(category) {
      switch (category) {
        case "work":
          return "عمل";
        case "home":
          return "منزل";
        case "personal":
        default:
          return "شخصي";
      }
    }

    function getPriorityBadge(priority) {
      switch (priority) {
        case "high":
          return "badge-priority-high";
        case "medium":
          return "badge-priority-medium";
        case "low":
        default:
          return "badge-priority-low";
      }
    }

    function getPriorityLabel(priority) {
      switch (priority) {
        case "high":
          return "مرتفعة";
        case "medium":
          return "متوسطة";
        case "low":
        default:
          return "منخفضة";
      }
    }

    function renderCompleted() {
      completedListEl.innerHTML = "";
      completedTasks.forEach((ct) => {
        const item = document.createElement("div");
        item.className = "completed-task" + (ct.missed ? " missed" : "");
        item.innerHTML = `
          <div class="completed-header">
            <div>
              <div class="completed-title">${ct.title}</div>
              <div style="font-size: 0.75rem; color: var(--text-soft);">
                ${ct.missed ? "مهمة فائتة" : "مهمة مكتملة"}
              </div>
            </div>
            <div class="completed-icon">
              ${ct.missed ? "😔" : "🎉"}
            </div>
          </div>
          ${
            ct.note
              ? `<div class="completed-note">${ct.note}</div>`
              : `<div class="completed-note">${
                  ct.missed
                    ? "لم تُكتب ملاحظة حول سبب التأجيل."
                    : "لم تُكتب ملاحظة حول شعورك بعد الإنجاز."
                }</div>`
          }
        `;
        completedListEl.appendChild(item);
      });
    }

    function deleteTask(id) {
      tasks = tasks.filter((t) => t.id !== id);
      renderTasks();
    }

    function openModal() {
      modalBackdropEl.classList.add("show");
    }

    function closeModal() {
      modalBackdropEl.classList.remove("show");
      currentModalTaskId = null;
      currentModalMode = null;
    }

    // مودال التعديل
    function openEditModal(id) {
      const task = tasks.find((t) => t.id === id);
      if (!task) return;
      currentModalTaskId = id;
      currentModalMode = "edit";

      modalTitleEl.textContent = "تعديل مهمة";
      modalBodyEl.innerHTML = `
        <label>عنوان المهمة</label>
        <input type="text" id="editTitle" value="${task.title}" />

        <label>التصنيف</label>
        <select id="editCategory">
          <option value="work" ${
            task.category === "work" ? "selected" : ""
          }>عمل</option>
          <option value="home" ${
            task.category === "home" ? "selected" : ""
          }>منزل</option>
          <option value="personal" ${
            task.category === "personal" ? "selected" : ""
          }>شخصي</option>
        </select>

        <label>الأولوية</label>
        <select id="editPriority">
          <option value="high" ${
            task.priority === "high" ? "selected" : ""
          }>مرتفعة</option>
          <option value="medium" ${
            task.priority === "medium" ? "selected" : ""
          }>متوسطة</option>
          <option value="low" ${
            task.priority === "low" ? "selected" : ""
          }>منخفضة</option>
        </select>

        <label>وقت انتهاء المهمة</label>
        <input type="datetime-local" id="editDue" value="${toLocalInputValue(
          task.due
        )}" />
      `;

      modalFooterEl.innerHTML = `
        <button class="btn-sm btn-outline" id="cancelEditBtn">إلغاء</button>
        <button class="btn-sm btn-fill" id="saveEditBtn">حفظ</button>
      `;

      document
        .getElementById("cancelEditBtn")
        .addEventListener("click", closeModal);
      document.getElementById("saveEditBtn").addEventListener("click", () => {
        const title = document.getElementById("editTitle").value.trim();
        const category = document.getElementById("editCategory").value;
        const priority = document.getElementById("editPriority").value;
        const dueStr = document.getElementById("editDue").value;

        if (!title || !dueStr) return;

        task.title = title;
        task.category = category;
        task.priority = priority;
        task.due = new Date(dueStr);

        renderTasks();
        closeModal();
      });

      openModal();
    }

    // مودال إكمال/فوات المهمة مع ملاحظة
    function openCompleteModal(id, mode) {
      const task = tasks.find((t) => t.id === id);
      if (!task) return;
      currentModalTaskId = id;
      currentModalMode = mode;

      if (mode === "complete") {
        modalTitleEl.textContent = "أحسنتِ! اكتبي شعورك بعد الإنجاز";
        modalBodyEl.innerHTML = `
          <label>ملاحظة تشجيعية (اختياري)</label>
          <textarea id="completeNote" rows="3" placeholder="مثال: شعور جميل، خطوة تقربني من هدفي..."></textarea>
        `;
      } else {
        modalTitleEl.textContent = "لم تكتمل المهمة في وقتها";
        modalBodyEl.innerHTML = `
          <label>لماذا لم تُنجز المهمة؟ (اختياري)</label>
          <textarea id="missedNote" rows="3" placeholder="كوني صادقة مع نفسك، ما الذي أخّرك؟"></textarea>
        `;
      }

      modalFooterEl.innerHTML = `
        <button class="btn-sm btn-outline" id="cancelCompleteBtn">إلغاء</button>
        <button class="btn-sm btn-fill" id="saveCompleteBtn">حفظ</button>
      `;

      document
        .getElementById("cancelCompleteBtn")
        .addEventListener("click", closeModal);

      document
        .getElementById("saveCompleteBtn")
        .addEventListener("click", () => {
          const noteEl =
            mode === "complete"
              ? document.getElementById("completeNote")
              : document.getElementById("missedNote");
          const note = noteEl.value.trim();

          task.completed = true;
          tasks = tasks.filter((t) => t.id !== id);

          completedTasks.unshift({
            id: task.id,
            title: task.title,
            note: note,
            missed: mode === "missed"
          });

          renderTasks();
          renderCompleted();
          closeModal();

          if (mode === "complete") {
            showToast("تم إنجاز المهمة، استمري بهذا المستوى!");
          } else {
            showToast("لا بأس، تعلّمنا من التأجيل ونكمل الرحلة.");
          }
        });

      openModal();
    }

    function toLocalInputValue(date) {
      const pad = (num) => String(num).padStart(2, "0");
      const year = date.getFullYear();
      const month = pad(date.getMonth() + 1);
      const day = pad(date.getDate());
      const hours = pad(date.getHours());
      const minutes = pad(date.getMinutes());
      return `${year}-${month}-${day}T${hours}:${minutes}`;
    }

    // مودال إضافة مهمة جديدة
    function openAddModal() {
      currentModalMode = "add";
      modalTitleEl.textContent = "إضافة مهمة جديدة";
      const now = new Date();
      const defaultDue = new Date(now.getTime() + 2 * 60 * 60 * 1000);

      modalBodyEl.innerHTML = `
        <label>عنوان المهمة</label>
        <input type="text" id="addTitle" placeholder="مثلًا: مراجعة درس في الجافاسكربت" />

        <label>التصنيف</label>
        <select id="addCategory">
          <option value="work">عمل</option>
          <option value="home">منزل</option>
          <option value="personal" selected>شخصي</option>
        </select>

        <label>الأولوية</label>
        <select id="addPriority">
          <option value="high">مرتفعة</option>
          <option value="medium" selected>متوسطة</option>
          <option value="low">منخفضة</option>
        </select>

        <label>وقت انتهاء المهمة</label>
        <input type="datetime-local" id="addDue" value="${toLocalInputValue(
          defaultDue
        )}" />
      `;

      modalFooterEl.innerHTML = `
        <button class="btn-sm btn-outline" id="cancelAddBtn">إلغاء</button>
        <button class="btn-sm btn-fill" id="saveAddBtn">إضافة</button>
      `;

      document
        .getElementById("cancelAddBtn")
        .addEventListener("click", closeModal);
      document.getElementById("saveAddBtn").addEventListener("click", () => {
        const title = document.getElementById("addTitle").value.trim();
        const category = document.getElementById("addCategory").value;
        const priority = document.getElementById("addPriority").value;
        const dueStr = document.getElementById("addDue").value;
        if (!title || !dueStr) return;

        const newTask = {
          id: Date.now(),
          title,
          category,
          priority,
          due: new Date(dueStr),
          completed: false
        };

        tasks.unshift(newTask);
        renderTasks();
        closeModal();
        showToast("تمت إضافة المهمة إلى يومك.");
      });

      openModal();
    }

    function showToast(message) {
      toastMessageEl.textContent = message;
      toastEl.classList.add("show");
      setTimeout(() => {
        toastEl.classList.remove("show");
      }, 2000);
    }

    // تبديل الدارك مود
    themeToggleEl.addEventListener("click", () => {
      document.body.classList.toggle("dark");
    });

    // الفلتر
    document.querySelectorAll("[data-filter]").forEach((btn) => {
      btn.addEventListener("click", () => {
        currentFilter = btn.getAttribute("data-filter");
        renderTasks();
      });
    });

    addTaskBtn.addEventListener("click", openAddModal);
    searchInput.addEventListener("input", renderTasks);
    closeModalBtn.addEventListener("click", closeModal);
    modalBackdropEl.addEventListener("click", (e) => {
      if (e.target === modalBackdropEl) {
        closeModal();
      }
    });

    // تحديث حالة التأخير كل دقيقة (لو حابة)
    setInterval(() => {
      renderTasks();
    }, 60 * 1000);

    // أول رسم
    renderTasks();
    renderCompleted();
  </script>
</body>
</html>
