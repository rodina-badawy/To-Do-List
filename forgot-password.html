<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://fav.farm/🔑" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    <style>
        :root {
            --bg-main: #f5f5f8;
            --bg-card: #ffffff;
            --text-main: #222;
            --text-soft: #373232;
            --primary: #3f51b5;
            --primary-soft: #e8eaf6;
            --border-soft: #e0e0e0;
            --input-bg: #f8f9fa;
        }

        /* تعديل الاستهداف للوضع المظلم */
        .dark {
            --bg-main: #141b2b;
            --bg-card: #0e172a;
            --text-main: #F8FAFC;
            --text-soft: #CBD5E1;
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --primary-soft: #312E81;
            --border-soft: #334155;
            --input-bg: #111827;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            transition: background 0.3s ease, color 0.3s ease; 
        }

        body {
            background-color: var(--bg-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        html[dir="rtl"] body { direction: rtl; }

        .reset-card {
            width: 100%;
            max-width: 450px;
            background-color: var(--bg-card);
            padding: 100px 40px 60px; 
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            position: relative;
            text-align: center;
        }

        .controls-top {
            position: absolute;
            top: 25px;
            left: 25px;
            right: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        html[dir="rtl"] .controls-top { flex-direction: row-reverse; }

        .lang-toggle {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            padding: 4px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        html:not(.dark) .lang-toggle { background: var(--primary-soft); border: none; }
        .dark .lang-toggle { background: rgba(255, 255, 255, 0.15); }

        .lang-toggle button {
            border: none;
            background: transparent;
            padding: 5px 15px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.75rem;
            color: var(--text-soft);
            font-weight: 700;
        }

        .dark .lang-toggle button { color: white; }
        .lang-toggle button.active { background: var(--primary); color: white !important; }

        .dark-toggle {
            background: var(--primary-soft);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .dark .dark-toggle {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .icon-box {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 20px;
            opacity: 0.9;
        }

        h2 { color: var(--text-main); font-size: 2rem; margin-bottom: 10px; }
        p.subtitle { color: var(--text-soft); margin-bottom: 35px; line-height: 1.5; }

        .input-group { margin-bottom: 25px; text-align: left; }
        html[dir="rtl"] .input-group { text-align: right; }

        .input-group label { color: var(--text-main); font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 8px; }

        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 15px; color: var(--text-soft); }
        html[dir="rtl"] .input-wrapper i { left: auto; right: 15px; }

        .input-wrapper input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            color: var(--text-main);
            outline: none;
        }
        html[dir="rtl"] .input-wrapper input { padding: 14px 45px 14px 15px; }

        .btn-reset {
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .back-link-container { text-align: center; margin-top: 25px; }
        .back-link-container a { color: var(--primary); text-decoration: none; font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        html[dir="rtl"] #backIcon { transform: rotate(180deg); }

    </style>
</head>
<body>

    <div class="reset-card">
        <div class="controls-top">
            <div class="lang-toggle">
                <button id="enBtn" onclick="changeLang('en')">EN</button>
                <button id="arBtn" onclick="changeLang('ar')">AR</button>
            </div>
            <button class="dark-toggle" id="modeBtn">
                <i class="fas fa-moon"></i>
            </button>
        </div>

        <div class="icon-box">
            <i class="fas fa-key"></i>
        </div>

        <h2 id="formTitle">Forgot Password?</h2>
        <p class="subtitle" id="formSubtitle">No worries, we'll send you reset instructions.</p>

        <form id="resetForm">
            <div class="input-group">
                <label for="email" id="labelEmail">Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
            </div>

            <button type="submit" class="btn-reset" id="btnReset">Reset Password</button>
        </form>

        <p class="back-link-container">
            <a href="login.html" id="backToLogin">
                <i class="fas fa-arrow-left" id="backIcon"></i> <span id="backText">Back to Login</span>
            </a>
        </p>
    </div>

    <script>
        const translations = {
            en: {
                formTitle: "Forgot Password?",
                formSubtitle: "No worries, we'll send you reset instructions.",
                labelEmail: "Email Address",
                btnReset: "Reset Password",
                backText: "Back to Login",
                placeholderEmail: "name@example.com",
                successMsg: "Reset link has been sent!"
            },
            ar: {
                formTitle: "نسيت كلمة المرور؟",
                formSubtitle: "لا تقلق، سنرسل لك تعليمات إعادة التعيين.",
                labelEmail: "البريد الإلكتروني",
                btnReset: "إعادة تعيين كلمة السر",
                backText: "العودة لتسجيل الدخول",
                placeholderEmail: "example@domain.com",
                successMsg: "تم إرسال رابط إعادة التعيين!"
            }
        };

        function changeLang(lang) {
            const html = document.documentElement;
            html.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            html.setAttribute('lang', lang);

            document.getElementById('formTitle').textContent = translations[lang].formTitle;
            document.getElementById('formSubtitle').textContent = translations[lang].formSubtitle;
            document.getElementById('labelEmail').textContent = translations[lang].labelEmail;
            document.getElementById('btnReset').textContent = translations[lang].btnReset;
            document.getElementById('backText').textContent = translations[lang].backText;
            document.getElementById('email').placeholder = translations[lang].placeholderEmail;

            document.getElementById('enBtn').classList.toggle('active', lang === 'en');
            document.getElementById('arBtn').classList.toggle('active', lang === 'ar');

            localStorage.setItem('lang', lang);
        }

        const modeBtn = document.getElementById('modeBtn');
        
        window.addEventListener('DOMContentLoaded', () => {
            // تحديث الأيقونة بناءً على حالة الـ html اللي اتعرفت في الـ head
            const isDark = document.documentElement.classList.contains('dark');
            if (isDark) {
                modeBtn.querySelector('i').classList.replace('fa-moon', 'fa-sun');
            }
            
            const savedLang = localStorage.getItem('lang') || 'en';
            changeLang(savedLang);
        });

        modeBtn.addEventListener('click', () => {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const icon = modeBtn.querySelector('i');
            const isDark = html.classList.contains('dark');
            icon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        document.getElementById('resetForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const currentLang = localStorage.getItem('lang') || 'en';
            alert(translations[currentLang].successMsg);
        });
    </script>
</body>
</html>
