<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://fav.farm/👤" />
    <title>Create Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #f5f5f8;
            --bg-card: #ffffff;
            --text-main: #222;
            --text-soft:#373232;
            --primary: #3f51b5;
            --primary-soft: #e8eaf6;
            --border-soft: #e0e0e0;
            --input-bg: #f8f9fa;
        }

        body.dark {
            --bg-main: #141b2b;
            --bg-card: #0e172a;
            --text-main: #F8FAFC;
            --text-soft: #CBD5E1;
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --primary-soft: #312E81;
            --border-soft: #334155;
            --input-bg: #111827;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; transition: background 0.3s ease, color 0.3s ease; }

        body {
            background-color: var(--bg-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        html[dir="rtl"] body { direction: rtl; }

        .login-card {
            display: flex;
            width: 1000px;
            min-height: 650px;
            max-width: 100%;
            background-color: var(--bg-card);
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            position: relative;
        }

        .controls-top {
            position: absolute;
            top: 25px;
            left: 25px;
            right: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        html[dir="rtl"] .controls-top {
            flex-direction: row-reverse;
        }

        .lang-toggle {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            padding: 4px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        body:not(.dark) .lang-toggle {
            background: var(--primary-soft);
            border: none;
        }

        .lang-toggle button {
            border: none;
            background: transparent;
            padding: 5px 15px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.75rem;
            color: white;
            font-weight: 700;
        }

        body:not(.dark) .lang-toggle button { color: var(--text-soft); }
        .lang-toggle button.active { background: var(--primary); color: white; }

        .dark-toggle {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        body:not(.dark) .dark-toggle {
            background: var(--primary-soft);
            color: var(--primary);
            border: none;
        }

        .side-info {
            flex: 1;
            background-color: var(--primary);
            padding: 60px 40px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .side-info i { font-size: 3.5rem; margin-bottom: 20px; opacity: 0.9; }
        .side-info h1 { font-size: 2rem; line-height: 1.2; margin-bottom: 15px; }

        .side-form {
            flex: 1.2;
            padding: 100px 50px 40px; 
            background-color: var(--bg-card);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .side-form h2 { color: var(--text-main); font-size: 1.8rem; margin-bottom: 8px; }
        .subtitle { color: var(--text-soft); margin-bottom: 25px; font-size: 0.9rem; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; color: var(--text-main); margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; }

        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 15px; color: var(--text-soft); }
        html[dir="rtl"] .input-wrapper i { left: auto; right: 15px; }

        .input-wrapper input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-soft);
            border-radius: 10px;
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
        }
        html[dir="rtl"] .input-wrapper input { padding: 12px 45px 12px 15px; }

        .btn-signup {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }

        .login-link-text { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-soft); }
        .login-link-text a { color: var(--primary); text-decoration: none; font-weight: 700; }

        @media (max-width: 768px) {
            .login-card { flex-direction: column; min-height: auto; }
            .side-info { padding: 80px 20px 40px; }
            .side-form { padding: 40px 25px; }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="controls-top">
        <div class="lang-toggle">
            <button id="enBtn" onclick="changeLang('en')">EN</button>
            <button id="arBtn" onclick="changeLang('ar')">AR</button>
        </div>
        <button class="dark-toggle" id="modeBtn">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <div class="side-info">
        <i class="fas fa-user-plus"></i>
        <h1 id="sideTitle">Start your journey with us today.</h1>
        <p id="sideDesc">Become part of our productive community.</p>
    </div>

    <div class="side-form">
        <h2 id="formTitle">Create Account</h2>
        <p class="subtitle" id="formSubtitle">Join us to start managing your tasks efficiently.</p>

        <form id="signupForm">
            <div class="input-group">
                <label id="labelName">Full Name</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="nameInput" placeholder="Your name" required>
                </div>
            </div>

            <div class="input-group">
                <label id="labelEmail">Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="emailInput" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="input-group">
                <label id="labelPass">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="passInput" placeholder="••••••••" required>
                </div>
            </div>

            <div class="input-group">
                <label id="labelConfirm">Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-shield-alt"></i>
                    <input type="password" id="confirmInput" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-signup" id="btnSubmit">Create Account</button>
        </form>

        <p class="login-link-text" id="footerText">
            Already have an account? <a href="login.html" id="loginLink">Sign In</a>
        </p>
    </div>
</div>

<script>
    const translations = {
        en: {
            sideTitle: "Start your journey with us today.",
            sideDesc: "Become part of our productive community.",
            formTitle: "Create Account",
            formSubtitle: "Join us to start managing your tasks efficiently.",
            labelName: "Full Name",
            labelEmail: "Email Address",
            labelPass: "Password",
            labelConfirm: "Confirm Password",
            btnSubmit: "Create Account",
            footerText: "Already have an account? ",
            loginLink: "Sign In",
            placeholderName: "Your name",
            placeholderEmail: "name@example.com"
        },
        ar: {
            sideTitle: "ابدأ رحلتك معنا اليوم.",
            sideDesc: "كن جزءاً من مجتمعنا المنتج.",
            formTitle: "إنشاء حساب",
            formSubtitle: "انضم إلينا لتبدأ في إدارة مهامك بكفاءة.",
            labelName: "الاسم الكامل",
            labelEmail: "البريد الإلكتروني",
            labelPass: "كلمة المرور",
            labelConfirm: "تأكيد كلمة المرور",
            btnSubmit: "إنشاء الحساب",
            footerText: "لديك حساب بالفعل؟ ",
            loginLink: "تسجيل الدخول",
            placeholderName: "اسـمك",
            placeholderEmail: "example@domain.com"
        }
    };

    function changeLang(lang) {
        const html = document.documentElement;
        html.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        html.setAttribute('lang', lang);

        document.getElementById('sideTitle').textContent = translations[lang].sideTitle;
        document.getElementById('sideDesc').textContent = translations[lang].sideDesc;
        document.getElementById('formTitle').textContent = translations[lang].formTitle;
        document.getElementById('formSubtitle').textContent = translations[lang].formSubtitle;
        document.getElementById('labelName').textContent = translations[lang].labelName;
        document.getElementById('labelEmail').textContent = translations[lang].labelEmail;
        document.getElementById('labelPass').textContent = translations[lang].labelPass;
        document.getElementById('labelConfirm').textContent = translations[lang].labelConfirm;
        document.getElementById('btnSubmit').textContent = translations[lang].btnSubmit;
        document.getElementById('nameInput').placeholder = translations[lang].placeholderName;
        document.getElementById('emailInput').placeholder = translations[lang].placeholderEmail;
        
     
        document.getElementById('footerText').innerHTML = translations[lang].footerText + `<a href="login.html" id="loginLink">${translations[lang].loginLink}</a>`;

        document.getElementById('enBtn').classList.toggle('active', lang === 'en');
        document.getElementById('arBtn').classList.toggle('active', lang === 'ar');

        
        localStorage.setItem('lang', lang);
    }

    const modeBtn = document.getElementById('modeBtn');
    
    window.addEventListener('DOMContentLoaded', () => {
        // تطبيق الثيم المخزن
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark');
            modeBtn.querySelector('i').classList.replace('fa-moon', 'fa-sun');
        }
        
        // تطبيق اللغة المخزنة
        const savedLang = localStorage.getItem('lang') || 'en';
        changeLang(savedLang);
    });

    modeBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark');
        const icon = modeBtn.querySelector('i');
        const isDark = document.body.classList.contains('dark');
        icon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    document.getElementById('signupForm').addEventListener('submit', (e) => {
        e.preventDefault();
        window.location.href = 'index.html'; 
    });
</script>

</body>
</html>
